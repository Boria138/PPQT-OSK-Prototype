[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "system-keyboard"
version = "0.1.0"
description = "Linux on-screen keyboard for X11 and layer-shell, using uinput"
requires-python = ">=3.9"
dependencies = [
    "PyGObject>=3.50,<4",
    "evdev>=1.7,<2",
]

[project.scripts]
system-keyboard = "system_keyboard.__main__:main"

[tool.setuptools.packages.find]
include = ["system_keyboard*"]
